<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samantha Phillips Real Estate — We've Moved</title>

<!-- GitHub Pages serves this file for every path that doesn't exist in this
     repo — which, since the repo holds only index.html, means every deep link
     to the old site. The script rewrites the path onto the new origin and
     forwards.

     Old and new slugs are identical, so /SamanthaPhillipsRealtor/properties/x/
     becomes /properties/x/ on samanthaphillipsrealtor.com and lands on the right listing.

     noindex, not "noindex, follow": this page is a 404, and inviting crawlers
     to follow a soft-404 into the new site muddies the move. The homepage
     canonical + the new sitemap are what drive re-indexing. -->
<meta name="robots" content="noindex">

<style>
	html{color-scheme:light dark}
	body{margin:0;min-height:100vh;display:grid;place-items:center;
	     font:400 1rem/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
	     background:#fff;color:#111;padding:2rem;text-align:center}
	@media (prefers-color-scheme:dark){body{background:#111;color:#f2f2f2}}
	h1{font-weight:300;font-size:1.5rem;margin:0 0 .75rem;letter-spacing:.01em}
	p{margin:0 0 1.5rem;opacity:.75}
	a.go{display:inline-block;padding:.75rem 1.5rem;border:1px solid currentColor;
	     border-radius:2px;text-decoration:none;color:inherit;letter-spacing:.06em;
	     text-transform:uppercase;font-size:.8rem}
</style>
</head>
<body>

<main>
	<h1>Samantha Phillips Real Estate has moved</h1>
	<p>Taking you to this page on the new site&hellip;</p>
	<a class="go" id="go" href="https://samanthaphillipsrealtor.com/">Continue to the site</a>
</main>

<script>
(function () {
	var NEW = "https://samanthaphillipsrealtor.com";
	var BASE = "/SamanthaPhillipsRealtor";   // the old GitHub Pages project path

	var path = location.pathname;

	// Strip the project prefix. Match the segment exactly so a hypothetical
	// /SamanthaPhillipsRealtorFoo isn't mangled into /Foo.
	if (path === BASE || path === BASE + "/") {
		path = "/";
	} else if (path.indexOf(BASE + "/") === 0) {
		path = path.slice(BASE.length);
	}

	// Only forward paths the old site actually served. Anything else was a 404
	// before the move and should stay one — silently rewriting every stray URL
	// onto the new origin just relocates the broken link and gives the new site
	// a pile of soft 404s.
	var known = path === "/"
		|| path === "/privacy-policy.html"
		|| /^\/properties\/[a-z0-9-]+\/?$/i.test(path);

	var target = NEW + (known ? path : "/");
	document.getElementById("go").href = target;
	if (!known) {
		document.querySelector("p").textContent =
			"That page has moved. Taking you to the homepage…";
	}
	location.replace(target);
})();
</script>

</body>
</html>
